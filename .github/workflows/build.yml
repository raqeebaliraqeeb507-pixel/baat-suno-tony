
name: Build Android APK
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip Project
        run: |
          unzip -o BaatSunoTony-Android.zip -d project_src
          SRC_DIR=$(find project_src -name "build.gradle*" -exec dirname {} \; | head -n 1)
          echo "PROJECT_DIR=$SRC_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BaatSunoTony-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
